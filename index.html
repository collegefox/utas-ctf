 try{const db=await claude.use("db");if(db){await db.collection("results").add(rec);ok=true}}catch(e){}
 if(!ok){try{const a=JSON.parse(localStorage.getItem('ck')||'[]');a.push(rec);localStorage.setItem('ck',JSON.stringify(a));ok=true}catch(e){}}
 const s=$('#sv');if(s)s.textContent=ok?'تم حفظ نتيجتك ✔':'تعذّر حفظ النتيجة';
}
function resTxt(){const r=LAST;return ['الاسم: '+r.icon+' '+r.name,'الفريق: '+(r.team||'-'),'المستوى: '+LV[r.lvl],'النقاط: '+r.pts,'الصحيح: '+r.ok+'/'+r.total+' ('+r.pct+'%)','الوقت: '+fmt(r.secs),'الرتبة: '+r.rank,'الشارات: '+(r.b.join('، ')||'-')].join('\n')}
function copyRes(){const t=resTxt(),m=()=>{const s=$('#sv');if(s)s.textContent='تم نسخ نتيجتك ✔ يمكنك لصقها في أي مكان'},f=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');m()}catch(e){prompt('انسخ نتيجتك:',t)}x.remove()};
 try{navigator.clipboard.writeText(t).then(m,f)}catch(e){f()}}
function sendRes(){const r=LAST,t=resTxt();
 const a=document.createElement('a');a.href='mailto:salimcollege@gmail.com?subject='+encodeURIComponent(r.name)+'&body='+encodeURIComponent(t);a.target='_blank';a.click();
 const s=$('#sv');if(s)s.textContent='تم فتح البريد لإرسال نتيجتك للمدير ✔ (اضغط «إرسال» في تطبيق البريد)'}
function cert(){const r=LAST;
 app.innerHTML=`<div class="card"><div class="cert"><div style="font-size:50px">🛡️</div><h2>شهادة إتمام</h2><p>تُمنح هذه الشهادة إلى</p><div class="nm">${esc(r.icon)} ${esc(r.name)}</div>
 <p>لإتمامه تحدّي الأمن السيبراني (${LV[r.lvl]})<br>بنتيجة ${r.ok}/${r.total} و ${r.pts} نقطة</p><p><b>الرتبة: ${r.rank}</b></p><p>${r.b.join(' · ')}</p><p style="font-size:13px">${new Date(r.ts).toLocaleDateString('ar-OM')}</p></div>
 <button class="btn noprint" style="margin-top:12px" onclick="window.print()">🖨️ طباعة</button><button class="btn s noprint" onclick="home()">رجوع</button></div>`}
function login(){
 app.innerHTML=`<div class="card"><h2>🔐 دخول المشرف</h2><label>اسم المستخدم</label><input id="u" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr"><label>كلمة المرور</label><input id="p" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" style="-webkit-text-security:disc">
 <div id="er" style="color:var(--bad);min-height:22px"></div><button class="btn" id="ok">دخول</button><button class="btn s" onclick="home()">رجوع</button></div>`;
 $('#ok').onclick=()=>{if($('#u').value.trim().toLowerCase()==='admin'&&$('#p').value.trim()==='pa$$w0rd')admin();else $('#er').textContent='بيانات غير صحيحة'};
}
async function admin(){
 app.innerHTML=`<div class="card"><h2>📊 لوحة المشرف</h2><p id="st" class="mut">جارٍ التحميل…</p>
 <div class="card" style="background:var(--bg);margin:10px 0"><label>➕ لصق نتيجة متسابق</label><textarea id="pa" rows="6" placeholder="الصق هنا النتيجة التي وصلتك (الاسم: … الفريق: … النقاط: …). يمكن لصق أكثر من نتيجة معًا." style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--ac2);background:var(--card);color:var(--fg);font-family:inherit;font-size:14px"></textarea><div id="pm" class="fb"></div><button class="btn s" id="pr">إضافة النتيجة إلى الجدول</button></div>
 <label>مدة المسابقة</label><select id="du">${[5,10,15,20,30].map(m=>`<option value="${m*60}" ${m*60==DUR?'selected':''}>${m} دقيقة</option>`).join('')}</select>
 <label>عدد أسئلة الجولة</label><select id="rn">${[6,8,10,12,15].map(n=>`<option value="${n}" ${n==RN?'selected':''}>${n} أسئلة</option>`).join('')}</select><input id="fi" placeholder="🔍 ابحث بالاسم أو الفريق" value="${esc(FIL)}"><div id="out"></div>
 <button class="btn" id="rf">تحديث</button><button class="btn s" id="ex">⬇️ تصدير CSV</button><button class="btn s" onclick="qadmin()">📝 إدارة الأسئلة</button><button class="btn s" id="cl">مسح نتائج هذا الجهاز</button><button class="btn s" onclick="home()">خروج</button></div>`;
 const sv=async()=>{DUR=+$('#du').value;RN=+$('#rn').value;try{localStorage.setItem('ckdur',DUR);localStorage.setItem('ckrn',RN)}catch(x){}try{const db=await claude.use("db");if(db)await db.doc("cfg/main").set({dur:DUR,rn:RN})}catch(x){}};$('#du').onchange=sv;$('#rn').onchange=sv;
 $('#fi').oninput=e=>{FIL=e.target.value;draw()};$('#rf').onclick=admin;$('#pr').onclick=addPasted;
 $('#cl').onclick=()=>{if(confirm('مسح نتائج هذا الجهاز؟')){try{localStorage.removeItem('ck')}catch(e){}admin()}};
 $('#ex').onclick=()=>{const h='الاسم,الفريق,المستوى,القسم,النقاط,الصحيح,الإجمالي,الثواني,التاريخ,النشاط,الفئة العمرية\n',b=ROWS.map(r=>[r.name,r.team||'',LV[r.lvl]??'',r.cat>=0?CATS[r.cat]:'الكل',r.pts??'',r.ok??r.score??'',r.total,r.secs,new Date(r.ts).toISOString(),r.mode||'تحدّي',r.age||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h+b],{type:'text/csv'}));a.download='results.csv';a.click()};
 ROWS=(await load()).sort((a,b)=>(b.pts??0)-(a.pts??0)||a.secs-b.secs);$('#st').textContent='عدد المشاركات: '+ROWS.length;draw();
}
function qadmin(){
 app.innerHTML=`<div class="card"><h2>📝 إدارة الأسئلة</h2><label>القسم</label><select id="qc">${CATS.map((c,k)=>`<option value="${k}">${c}</option>`).join('')}</select>
 <label>المستوى</label><select id="ql">${LV.map((c,k)=>`<option value="${k}">${c}</option>`).join('')}</select>
 <input id="qq" placeholder="نص السؤال"><input id="o0" placeholder="الخيار الأول (الإجابة الصحيحة)"><input id="o1" placeholder="الخيار الثاني"><input id="o2" placeholder="الخيار الثالث"><input id="o3" placeholder="الخيار الرابع">
 <input id="qe" placeholder="الشرح بعد الإجابة"><p class="mut">اكتب الإجابة الصحيحة في الخيار الأول، وسيُخلط ترتيب الخيارات تلقائيًا للمتسابق.</p><div id="er" style="color:var(--bad)"></div>
 <button class="btn" id="qa">إضافة السؤال</button><h3>أسئلتي المضافة (${CQ.length})</h3><div id="cl2">${CQ.map((x,k)=>`<div style="margin:6px 0">• ${esc(x.q)} <button class="opt" style="display:inline;width:auto;padding:2px 10px" data-d="${k}">🗑️</button></div>`).join('')||'<span class="mut">لا توجد أسئلة مضافة بعد.</span>'}</div>
 <button class="btn s" onclick="admin()">رجوع</button></div>`;
 $('#qa').onclick=async()=>{const q=$('#qq').value.trim(),o=[0,1,2,3].map(k=>$('#o'+k).value.trim());if(!q||o.some(x=>!x)){$('#er').textContent='أكمل السؤال والخيارات الأربعة';return}
  CQ.push({c:+$('#qc').value,l:+$('#ql').value,q,o,a:0,e:$('#qe').value.trim()});await saveQ();qadmin()};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{CQ.splice(+b.dataset.d,1);await saveQ();qadmin()});
}
async function addPasted(){
 const tx=$('#pa').value.replace(/\r/g,'').trim(),M=$('#pm');
 const bl=tx.split(/(?=الاسم *[:：])/).filter(x=>/الاسم *[:：]/.test(x));
 if(!bl.length){M.textContent='❌ لم أجد سطر «الاسم:» في النص الملصوق';return}
 let db=null;try{db=await claude.use('db')}catch(e){}
 let n=0,d=0,bad=0;
 for(const b of bl){
  const mp={};b.split('\n').forEach(l=>{const k=l.search(/[:：]/);if(k>0)mp[l.slice(0,k).trim()]=l.slice(k+1).trim()});
  const pr=(mp['الاسم']||'').split(' '),ic=/[A-Za-z0-9ء-ي]/.test(pr[0])?'':pr.shift(),
   ok=(mp['الصحيح']||'').match(/([0-9]+) *\/ *([0-9]+)/),tm=(mp['الوقت']||'').match(/([0-9]+):([0-9]+)/),li=LV.indexOf(mp['المستوى']);
  if(!pr.join(' ').trim()||!ok){bad++;continue}
  const rec={name:pr.join(' ').trim(),icon:ic,team:mp['الفريق']=='-'?'':(mp['الفريق']||''),lvl:li<0?0:li,cat:-1,pts:parseInt(mp['النقاط'])||0,ok:+ok[1],total:+ok[2],secs:tm?(+tm[1])*60+(+tm[2]):0,ts:Date.now(),w:[],b:(mp['الشارات']||'').split('،').map(x=>x.trim()).filter(x=>x&&x!='-'),mode:'مُلصقة',age:''};
  if(ROWS.some(r=>r.name==rec.name&&(r.pts??0)==rec.pts&&r.secs==rec.secs&&r.total==rec.total)){d++;continue}
  let sv=0;try{if(db){await db.collection('results').add(rec);sv=1}}catch(e){}
  if(!sv){try{const a=JSON.parse(localStorage.getItem('ck')||'[]');a.push(rec);localStorage.setItem('ck',JSON.stringify(a));sv=1}catch(e){}}
  if(sv){ROWS.push(rec);n++}else bad++}
 ROWS.sort((a,b)=>(b.pts??0)-(a.pts??0)||a.secs-b.secs);$('#st').textContent='عدد المشاركات: '+ROWS.length;draw();
 M.textContent='✅ أُضيفت '+n+' نتيجة'+(d?' · تجاهلت '+d+' مكررة':'')+(bad?' · تعذّر قراءة '+bad:'');if(n)$('#pa').value=''}
function draw(){
 const f=FIL.trim().toLowerCase(),R=ROWS.filter(r=>!f||(r.name+' '+(r.team||'')).toLowerCase().includes(f));
 const miss={};ROWS.forEach(r=>(r.w||[]).forEach(k=>miss[k]=(miss[k]||0)+1));
 const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const tm={};ROWS.forEach(r=>{if(r.team)tm[r.team]=(tm[r.team]||0)+(r.pts||0)});
 const te=Object.entries(tm).sort((a,b)=>b[1]-a[1]);
 $('#out').innerHTML=(R.length?`<div class="wrap"><table><tr><th>#</th><th>المشارك</th><th>الفريق</th><th>النشاط</th><th>المستوى</th><th>النقاط</th><th>الصحيح</th><th>الوقت</th></tr>${R.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.icon)} ${esc(r.name)}</td><td>${esc(r.team||'-')}</td><td>${esc(r.mode||'تحدّي')}</td><td>${LV[r.lvl]??'-'}</td><td>${r.pts??'-'}</td><td>${r.ok??r.score}/${r.total}</td><td>${fmt(r.secs)}</td></tr>`).join('')}</table></div>`:'<p>لا توجد نتائج.</p>')
 +(te.length?`<h3>👥 ترتيب الفرق</h3>${te.map(([n,p],k)=>`<div>${k+1}. ${esc(n)} — ${p} نقطة</div>`).join('')}`:'')
 +(top.length?`<h3>❗ أكثر الأسئلة خطأً</h3>${top.map(([k,n])=>`<div style="margin:6px 0">• ${[].concat(Q[k][2])[0]} <b style="color:var(--bad)">(${n})</b></div>`).join('')}`:'');
}
home();
</script>
