<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية الهاكر الصغير — الأمان الرقمي للأطفال</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#030b07;--panel:#07170f;--g:#39ff88;--c:#22e3ff;--r:#ff3d6e;--y:#ffd23f;--t:#d8ffe8;--dim:#6fa88a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font-family:'Tajawal',sans-serif;min-height:100vh;overflow-x:hidden}
#rain{position:fixed;inset:0;z-index:0;opacity:.35}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.float{position:fixed;z-index:1;font-size:2rem;opacity:.5;animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-30px) rotate(10deg)}}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:18px 16px 60px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;font-family:'Share Tech Mono',monospace}
nav button{background:transparent;color:var(--g);border:1px solid var(--g);padding:7px 14px;border-radius:4px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:var(--g);color:#032}
.hero{text-align:center;padding:10px 0 4px}
.shield{font-size:5.2rem;display:inline-block;filter:drop-shadow(0 0 18px var(--g));animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);filter:drop-shadow(0 0 34px var(--c))}}
h1{font-size:clamp(1.9rem,6vw,3rem);font-weight:800;color:var(--g);text-shadow:0 0 14px rgba(57,255,136,.6);position:relative;display:inline-block}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
h1::before{color:var(--r);left:2px;animation:gl 3s infinite steps(1);clip-path:inset(0 0 60% 0)}
h1::after{color:var(--c);left:-2px;animation:gl 2.4s infinite steps(1) reverse;clip-path:inset(55% 0 0 0)}
@keyframes gl{0%,90%{transform:translateX(0)}92%{transform:translateX(-4px)}96%{transform:translateX(4px)}}
.term{font-family:'Share Tech Mono',monospace;color:var(--dim);margin:10px 0 18px;min-height:1.6em}
.term::after{content:"▌";color:var(--g);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.card{background:var(--panel);border:1px solid rgba(57,255,136,.35);border-radius:10px;padding:20px;box-shadow:0 0 24px rgba(57,255,136,.08)}
label{display:block;margin:12px 0 6px;color:var(--g)}
input,select{width:100%;padding:12px;background:#020805;color:var(--t);border:1px solid var(--dim);border-radius:6px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatars button{font-size:1.9rem;background:#020805;border:2px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer}
.avatars button.on{border-color:var(--g);box-shadow:0 0 14px var(--g);animation:pulse 1.6s infinite}
.btn{background:var(--g);color:#032;border:0;padding:13px 22px;border-radius:6px;font:800 1.1rem 'Tajawal';cursor:pointer;margin-top:16px;transition:transform .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px var(--g)}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
.bar{height:10px;background:#020805;border-radius:6px;overflow:hidden;margin-bottom:14px;border:1px solid var(--dim)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--c));transition:width .5s}
.qicon{font-size:4rem;text-align:center;animation:fl 3s ease-in-out infinite}
.q{font-size:1.35rem;font-weight:800;margin:6px 0 14px;text-align:center}
.opt{display:block;width:100%;text-align:right;background:#020805;color:var(--t);border:1px solid var(--dim);border-radius:8px;padding:13px;margin:8px 0;font:500 1.05rem 'Tajawal';cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 12px var(--c)}
.opt.ok{border-color:var(--g);background:rgba(57,255,136,.18)}
.opt.no{border-color:var(--r);background:rgba(255,61,110,.18);animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{margin-top:12px;padding:12px;border-radius:8px;border-right:4px solid var(--y);background:rgba(255,210,63,.08)}
.hud{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;color:var(--dim);margin-bottom:8px}
.big{font-size:3.4rem;color:var(--g);text-align:center;font-weight:800;text-shadow:0 0 16px var(--g)}
.lb div{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px dashed rgba(57,255,136,.25)}
.lb b{margin-inline-start:auto;color:var(--y);font-family:'Share Tech Mono'}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stats div{background:#020805;border:1px solid var(--dim);border-radius:8px;padding:12px;text-align:center}
.stats strong{display:block;font-size:1.8rem;color:var(--c);font-family:'Share Tech Mono'}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid rgba(57,255,136,.2);text-align:right;white-space:nowrap}th{color:var(--g)}
.msg{margin-top:10px;color:var(--y)}.hide{display:none}
.badge{font-family:'Share Tech Mono';font-size:.8rem;padding:3px 8px;border-radius:20px;border:1px solid}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<span class="float" style="top:12%;right:4%">🔒</span><span class="float" style="top:30%;left:3%;animation-delay:1s">🐞</span>
<span class="float" style="top:62%;right:3%;animation-delay:2s">🛰️</span><span class="float" style="top:80%;left:5%;animation-delay:3s">🔑</span>
<main>
<div class="hero">
  <div class="shield">🛡️</div>
  <h1 data-t="أكاديمية الهاكر الصغير">أكاديمية الهاكر الصغير</h1>
  <div class="term" id="term"></div>
</div>
<nav>
  <button data-go="home" class="on">🏠 البداية</button>
  <button data-go="board">🏆 الأبطال</button>
  <button data-go="admin">🧑‍💻 المشرف</button>
  <span class="badge" id="mode"></span>
</nav>

<!-- التسجيل -->
<section id="home" class="card">
  <h2>🎮 سجّل كوكيل سري</h2>
  <label for="nm">اسمك</label><input id="nm" maxlength="40" placeholder="مثال: سالم">
  <label for="gr">صفك</label>
  <select id="gr"><option>الصف الرابع</option><option>الصف الخامس</option><option>الصف السادس</option><option>الصف السابع</option><option>الصف الثامن</option></select>
  <label>اختر شخصيتك</label>
  <div class="avatars" id="av"></div>
  <button class="btn" id="start">ابدأ المهمة 🚀</button>
  <div class="msg" id="hmsg"></div>
</section>

<!-- المسابقة -->
<section id="quiz" class="card hide">
  <div class="hud"><span id="who"></span><span id="sc">⭐ 0</span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="qicon" id="qi"></div><div class="q" id="qt"></div>
  <div id="qo"></div><div id="qf"></div>
  <button class="btn hide" id="nx">المهمة التالية ➜</button>
</section>

<!-- النتيجة -->
<section id="done" class="card hide" style="text-align:center">
  <div class="shield" id="dI">🏅</div><div class="big" id="dS"></div>
  <p id="dT" style="margin:10px 0"></p>
  <button class="btn" onclick="show('board')">🏆 لوحة الأبطال</button>
  <button class="btn ghost" onclick="location.reload()">العب مرة أخرى</button>
</section>

<!-- لوحة الأبطال -->
<section id="board" class="card hide"><h2>🏆 أفضل ١٠ وكلاء</h2><div class="lb" id="lb">…</div></section>

<!-- لوحة المشرف -->
<section id="admin" class="card hide">
  <h2>🧑‍💻 لوحة المشرف</h2>
  <div id="lg"><label for="ap">كلمة مرور المشرف</label><input id="ap" type="password" autocomplete="off">
  <button class="btn" id="al">دخول</button></div>
  <div id="ad" class="hide">
    <div class="stats"><div><strong id="s1">0</strong>المسجّلون</div><div><strong id="s2">0</strong>أنهوا المسابقة</div><div><strong id="s3">0</strong>متوسط النقاط</div></div>
    <button class="btn ghost" id="rf">🔄 مزامنة النتائج</button> <button class="btn ghost" id="csv">⬇️ CSV</button>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>الصف</th><th>النقاط</th><th>الصحيحة</th><th>التقدم</th><th>الحالة</th><th>آخر تحديث</th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
  <div class="msg" id="amsg"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="database.js"></script>
<script>
const $=id=>document.getElementById(id);
const Q=[
 {i:'🔑',q:'أي كلمة مرور هي الأقوى؟',o:['123456','اسمي2015','Zq!7#kLm_92'],a:2,e:'الكلمة القوية طويلة وفيها حروف وأرقام ورموز ولا تتعلق باسمك.'},
 {i:'🕵️',q:'شخص غريب في لعبة طلب منك عنوان بيتك. ماذا تفعل؟',o:['أعطيه العنوان','أتجاهله وأخبر أهلي','أعطيه اسم الحي فقط'],a:1,e:'لا نشارك معلوماتنا الشخصية مع الغرباء، ونخبر شخصاً بالغاً نثق به.'},
 {i:'🎣',q:'وصلتك رسالة: «مبروك! ربحت جائزة، اضغط الرابط». هذا غالباً…',o:['هدية حقيقية','صيد احتيالي (Phishing)','رسالة من المدرسة'],a:1,e:'المحتالون يصطادون بالجوائز الوهمية. لا تضغط على الروابط المجهولة.'},
 {i:'🔐',q:'لمن يمكنك إعطاء كلمة مرورك؟',o:['لأعز أصدقائي','لوالديّ فقط','لكل من يطلبها بلطف'],a:1,e:'كلمة المرور سرّك. نشاركها مع والدينا فقط.'},
 {i:'🦠',q:'ظهرت نافذة تقول: «جهازك مصاب! نزّل هذا البرنامج الآن». ماذا تفعل؟',o:['أنزّله بسرعة','أغلقها وأخبر أهلي','أكتب بياناتي فيها'],a:1,e:'هذه نوافذ مخادعة قد تحمل فيروسات. أغلقها واطلب مساعدة بالغ.'},
 {i:'📸',q:'قبل نشر صورة لك على الإنترنت يجب أن…',o:['أنشرها فوراً','أسأل أهلي وأتأكد أنها لا تكشف مكاني','أضيف موقع بيتي'],a:1,e:'ما يُنشر على الإنترنت قد يبقى للأبد، ولا نكشف مواقعنا.'},
 {i:'😠',q:'أحدهم يتنمّر عليك في الدردشة. الحل الأفضل:',o:['أرد عليه بقسوة','أحتفظ بصورة للرسائل وأبلغ شخصاً بالغاً','أحذف حسابي وأسكت'],a:1,e:'نحفظ الدليل ونبلّغ. التنمّر ليس خطأك أبداً.'},
 {i:'🔄',q:'لماذا نحدّث برامج الجهاز باستمرار؟',o:['لسدّ الثغرات الأمنية','ليصبح لونه أجمل','لا فائدة منها'],a:0,e:'التحديثات تصلح الثغرات التي يستغلها المخترقون.'}
];
const AV=['🕵️','🦊','🤖','👾','🐉','🦅'];let av=AV[0],P=null,S=null,idx=0,t0=0,locked=false,adminPass='';
const ranks=[[70,'🥇 هاكر أخلاقي أسطوري','أنت حارس الإنترنت!'],[40,'🥈 وكيل محترف','أداء رائع، راجع الأسئلة التي أخطأت فيها.'],[0,'🥉 متدرب شجاع','تابع التعلم وستصبح بطلاً!']];

// عناصر عامة
$('av').innerHTML=AV.map((a,i)=>`<button type="button" class="${i?'':'on'}" aria-label="شخصية ${a}">${a}</button>`).join('');
$('av').onclick=e=>{const b=e.target.closest('button');if(!b)return;av=b.textContent;[...$('av').children].forEach(x=>x.classList.toggle('on',x===b))};
function show(id){['home','quiz','done','board','admin'].forEach(s=>$(s).classList.toggle('hide',s!==id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));
  if(id==='board')loadBoard();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(P&&!S.finished&&b.dataset.go==='home'?'quiz':b.dataset.go));

// الطباعة الآلية
(function(){const m='> الوصول مسموح... تعلّم كيف تحمي نفسك في العالم الرقمي';let i=0;const t=setInterval(()=>{$('term').firstChild?($('term').firstChild.nodeValue=m.slice(0,++i)):$('term').prepend(m[0]);if(i>=m.length)clearInterval(t)},45)})();

// مطر الشيفرة
(function(){const c=$('rain'),x=c.getContext('2d');let w,h,d;const ch='01ABCDEF{}<>$#أبجد'.split('');
 function rs(){w=c.width=innerWidth;h=c.height=innerHeight;d=Array(Math.ceil(w/18)).fill(0).map(()=>Math.random()*h/18)}
 rs();addEventListener('resize',rs);
 setInterval(()=>{x.fillStyle='rgba(3,11,7,.12)';x.fillRect(0,0,w,h);x.fillStyle='#39ff88';x.font='16px monospace';
  d.forEach((y,i)=>{x.fillText(ch[Math.random()*ch.length|0],i*18,y*18);d[i]=y*18>h&&Math.random()>.97?0:y+1})},60)})();

// وضع الاتصال
DB.init();const cloud=DB.isCloud();
$('mode').textContent=cloud?'☁️ متصل بـ Supabase':'💾 وضع تجريبي محلي';
$('mode').style.color=cloud?'var(--g)':'var(--y)';

// التسجيل السحابي
$('start').onclick=async()=>{
  const name=$('nm').value.trim();if(name.length<2){$('hmsg').textContent='اكتب اسمك (حرفان على الأقل).';return}
  $('start').disabled=true;$('hmsg').textContent='⏳ جارٍ التسجيل...';
  try{P=await DB.registerPlayer(name,$('gr').value,av)}
  catch(e){$('hmsg').textContent='تعذّر التسجيل: '+e.message;$('start').disabled=false;return}
  S={score:0,correct:0,answered:0,total:Q.length,finished:false,duration:0};idx=0;t0=Date.now();
  $('who').textContent=av+' '+name;show('quiz');ask();
};

// المسابقة
function ask(){locked=false;const q=Q[idx];$('qi').textContent=q.i;$('qt').textContent=q.q;$('qf').innerHTML='';$('nx').classList.add('hide');
  $('pb').style.width=(idx/Q.length*100)+'%';
  $('qo').innerHTML=q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');}
$('qo').onclick=async e=>{const b=e.target.closest('.opt');if(!b||locked)return;locked=true;
  const q=Q[idx],i=+b.dataset.i,ok=i===q.a;
  [...$('qo').children].forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('ok');else if(k===i)x.classList.add('no')});
  S.answered++;if(ok){S.correct++;S.score+=10}
  S.duration=Math.round((Date.now()-t0)/1000);S.finished=S.answered===Q.length;
  $('sc').textContent='⭐ '+S.score;
  $('qf').innerHTML=`<div class="fb">${ok?'✅ أحسنت! ':'❌ ليس تماماً. '}${q.e}</div>`;
  $('nx').textContent=S.finished?'اعرض نتيجتي 🏁':'المهمة التالية ➜';$('nx').classList.remove('hide');
  DB.saveProgress(P.token,S).catch(()=>{$('qf').innerHTML+='<div class="msg">⚠️ لم يُحفظ التقدم، تحقق من الاتصال.</div>'});
};
$('nx').onclick=()=>{if(S.finished)return finish();idx++;ask()};
function finish(){$('pb').style.width='100%';const pct=S.score/(Q.length*10)*100;
  const rr=pct>=70?ranks[0]:pct>=40?ranks[1]:ranks[2];
  $('dI').textContent=rr[1].slice(0,2);$('dS').textContent=S.score+' / '+Q.length*10;
  $('dT').textContent=rr[1].slice(3)+' — '+rr[2];show('done')}

// لوحة الأبطال
async function loadBoard(){$('lb').textContent='⏳ ...';
  try{const d=await DB.getLeaderboard();
   $('lb').innerHTML=d.length?d.map((p,i)=>`<div><span>${['🥇','🥈','🥉'][i]||i+1}</span><span>${esc(p.avatar)} ${esc(p.name)}</span><b>${p.score}</b></div>`).join(''):'لا يوجد أبطال بعد. كن أول واحد!'}
  catch(e){$('lb').textContent='تعذّر التحميل: '+e.message}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// لوحة المشرف
let rows=[];
async function loadAdmin(){$('amsg').textContent='⏳ جارٍ المزامنة...';
  try{rows=await DB.adminResults(adminPass);
   $('lg').classList.add('hide');$('ad').classList.remove('hide');$('amsg').textContent='';
   const fin=rows.filter(r=>r.finished).length,avg=rows.length?Math.round(rows.reduce((a,r)=>a+r.score,0)/rows.length):0;
   $('s1').textContent=rows.length;$('s2').textContent=fin;$('s3').textContent=avg;
   $('tb').innerHTML=rows.map(r=>`<tr><td>${esc(r.avatar)} ${esc(r.name)}</td><td>${esc(r.grade)}</td><td>${r.score}</td><td>${r.correct}</td><td>${r.answered}/${r.total}</td><td>${r.finished?'✅ مكتمل':'⏳ جارٍ'}</td><td>${new Date(r.updated_at).toLocaleString('ar-OM')}</td></tr>`).join('')}
  catch(e){$('amsg').textContent='❌ '+e.message}}
$('al').onclick=()=>{adminPass=$('ap').value;loadAdmin()};
$('rf').onclick=loadAdmin;
$('csv').onclick=()=>{const h='الاسم,الصف,النقاط,الصحيحة,المجاب,الكل,مكتمل,المدة(ث)\n';
  const b=new Blob(['\ufeff'+h+rows.map(r=>[r.name,r.grade,r.score,r.correct,r.answered,r.total,r.finished,r.duration_s].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='results.csv';a.click()};
setInterval(()=>{if(!$('ad').classList.contains('hide')&&!$('admin').classList.contains('hide'))loadAdmin()},30000);
</script>
</body>
</html>
